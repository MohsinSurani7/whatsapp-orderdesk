[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Next.js embeds env into server/client bundles; omit app keys from Netlify secret scan
  # Next.js inlines server env into .next at build; Netlify then flags those values as "exposed".
  # These keys are server-only (never NEXT_PUBLIC_). Omit them from deploy-time secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,SUPABASE_SERVICE_ROLE_KEY,SESSION_SECRET,TOKEN_ENCRYPTION_KEY,AI_PROVIDER,GROQ_API_KEY,GROQ_MODEL,GEMINI_API_KEY,WHATSAPP_VERIFY_TOKEN,WHATSAPP_ACCESS_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_WABA_ID,META_APP_ID,META_APP_SECRET,META_EMBEDDED_SIGNUP_CONFIG_ID,META_GRAPH_VERSION"

[[plugins]]
  package = "@netlify/plugin-nextjs"
